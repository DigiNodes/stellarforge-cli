version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
