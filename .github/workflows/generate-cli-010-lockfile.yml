name: Generate CLI-010 lockfile

on:
  push:
    branches:
      - ci/cli-010-changesets
    paths:
      - package.json
      - .github/workflows/generate-cli-010-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'DigiNodes/stellarforge-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout maintainer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Changesets is locked
        run: node -e "const lock=require('./package-lock.json'); if (!lock.packages?.['node_modules/@changesets/cli']) process.exit(1)"

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git commit -m 'chore: lock Changesets dependency'
          git push origin HEAD:ci/cli-010-changesets
