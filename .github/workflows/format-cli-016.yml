name: Format CLI-016

on:
  push:
    branches:
      - feat/cli-016-doctor-scaffold
    paths:
      - .github/workflows/format-cli-016.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'DigiNodes/stellarforge-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout maintainer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply repository Prettier
        run: node node_modules/prettier/bin/prettier.cjs --write src/commands/doctor.ts src/diagnostics/run.ts tests/doctor.test.ts

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commands/doctor.ts src/diagnostics/run.ts tests/doctor.test.ts
          if git diff --cached --quiet; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git commit -m 'style: format doctor scaffold'
          git push origin HEAD:feat/cli-016-doctor-scaffold
