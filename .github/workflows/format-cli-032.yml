name: Diagnose CLI-032 formatting

on:
  push:
    branches:
      - feat/cli-032-test-orchestration

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prettier --write src/testing/project.ts tests/test-command.test.ts
      - run: git diff -- src/testing/project.ts tests/test-command.test.ts
