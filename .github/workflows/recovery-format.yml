name: Temporary Recovery Formatter

on:
  push:
    branches:
      - maint/recovery-production-build

permissions: {}

jobs:
  format:
    if: github.ref == 'refs/heads/maint/recovery-production-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maint/recovery-production-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the repository's declared Prettier formatting
        run: npm run format

      - name: Commit formatter-only changes to this recovery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests eslint.config.js vitest.config.ts package.json tsconfig*.json .prettierrc
          if git diff --cached --quiet; then
            echo 'No formatting changes were necessary.'
            exit 0
          fi
          git commit -m 'style: apply repository Prettier baseline'
          git push origin HEAD:maint/recovery-production-build
