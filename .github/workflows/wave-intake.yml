name: Wave Intake

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wave-intake.yml'
      - 'docs/contributing/wave-backlog-plan.md'
  issues:
    types: [closed, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wave-intake
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Wave dependency and intake state
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile Wave issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const READY_LIMIT = 20;
            const FIRST_BATCH = new Set([
              'SW-001','SW-002','SW-003','SW-004','SW-005','SW-006',
              'SW-007','SW-008','SW-009','SW-010','SW-011','SW-012',
              'SW-013','SW-014','SW-019','SW-020'
            ]);

            const managedLabels = [
              { name: 'intake: ready', color: '0e8a16', description: 'Open for contributor claims' },
              { name: 'intake: queued', color: 'c5def5', description: 'Wave backlog not yet open for claims' },
              { name: 'blocked', color: 'b60205', description: 'Blocked by an unresolved dependency' },
              { name: 'status: in progress', color: 'fbca04', description: 'Claimed and actively being worked on' },
              { name: 'status: stale', color: 'd4c5f9', description: 'Needs contributor or maintainer follow-up' },
            ];

            for (const label of managedLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const wave = issues
              .filter((issue) => !issue.pull_request && /^SW-\d{3}\b/.test(issue.title))
              .sort((a, b) => a.title.localeCompare(b.title));

            const byId = new Map(
              wave.map((issue) => [issue.title.match(/^SW-\d{3}/)[0], issue]),
            );

            function dependencies(issue) {
              const section = (issue.body || '').split(/## Dependencies/i)[1] || '';
              const bounded = section.split(/\n---|\n## /)[0];
              return [...new Set(bounded.match(/SW-\d{3}/g) || [])];
            }

            const state = [];
            for (const issue of wave) {
              const id = issue.title.match(/^SW-\d{3}/)[0];
              const deps = dependencies(issue);
              const unresolved = deps.filter((dep) => {
                const target = byId.get(dep);
                return target && target.state === 'open';
              });
              state.push({ issue, id, unresolved });
            }

            const currentlyReady = state.filter(({ issue, unresolved }) => {
              const labels = new Set(issue.labels.map((label) => label.name));
              return unresolved.length === 0 &&
                labels.has('intake: ready') &&
                !labels.has('status: in progress');
            });

            let capacity = Math.max(0, READY_LIMIT - currentlyReady.length);

            for (const entry of state) {
              const { issue, id, unresolved } = entry;
              const labels = new Set(issue.labels.map((label) => label.name));
              const inProgress = labels.has('status: in progress');
              const shouldSeed = FIRST_BATCH.has(id);
              const mayPromote =
                !inProgress &&
                unresolved.length === 0 &&
                !labels.has('intake: ready') &&
                (shouldSeed || capacity > 0);

              const add = [];
              const remove = [];

              if (unresolved.length > 0) {
                if (!labels.has('blocked')) add.push('blocked');
                if (labels.has('intake: ready')) remove.push('intake: ready');
                if (!labels.has('intake: queued')) add.push('intake: queued');
                if (labels.has('help wanted')) remove.push('help wanted');
              } else {
                if (labels.has('blocked')) remove.push('blocked');

                if (labels.has('intake: ready') || mayPromote) {
                  if (!labels.has('intake: ready')) add.push('intake: ready');
                  if (labels.has('intake: queued')) remove.push('intake: queued');
                  if (!inProgress && !labels.has('help wanted')) add.push('help wanted');
                  if (!labels.has('intake: ready') && !shouldSeed) capacity -= 1;
                } else {
                  if (!labels.has('intake: queued')) add.push('intake: queued');
                  if (labels.has('help wanted')) remove.push('help wanted');
                }
              }

              if (add.length) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: add,
                });
              }
              for (const name of remove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issue.number, name,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            core.info(`Reconciled ${wave.length} Wave issues; ready limit ${READY_LIMIT}.`);
