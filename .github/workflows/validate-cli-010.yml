name: Validate CLI-010 Changesets integration

on:
  push:
    branches:
      - ci/cli-010-changesets
    paths:
      - package.json
      - package-lock.json
      - .changeset/**
      - CONTRIBUTING.md
      - docs/contributing/changesets.md
      - .github/workflows/validate-cli-010.yml

permissions:
  contents: read

jobs:
  validate-changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate package and Changesets configuration
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('.changeset/config.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.name !== '@stellarforge/cli') throw new Error('Unexpected package name');
          if (pkg.devDependencies?.['@changesets/cli'] !== '3.0.2') throw new Error('Changesets version is not pinned');
          if (!lock.packages?.['node_modules/@changesets/cli']) throw new Error('Changesets missing from lockfile');
          if (config.baseBranch !== 'main') throw new Error('Changesets baseBranch must be main');
          if (config.privatePackages?.version !== true) throw new Error('Private package versioning must be enabled');
          if (config.privatePackages?.tag !== false) throw new Error('Private package tagging must stay disabled');
          NODE

      - name: Check repository quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Create disposable release intent
        run: |
          cat > .changeset/cli-010-validation.md <<'EOF'
          ---
          "@stellarforge/cli": patch
          ---

          Validate local Changesets version and changelog generation.
          EOF

      - name: Inspect pending release intent
        run: npm run changeset:status

      - name: Generate disposable version and changelog
        run: npm run changeset:version

      - name: Verify generated release metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.0.1') throw new Error(`Expected disposable 0.0.1 version, got ${pkg.version}`);
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes('0.0.1')) throw new Error('Generated changelog missing 0.0.1');
          if (!changelog.includes('Validate local Changesets version and changelog generation.')) throw new Error('Generated changelog missing validation entry');
          NODE

      - name: Prove validation did not create release tags
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo 'Unexpected release tag created during validation.'
            exit 1
          fi
