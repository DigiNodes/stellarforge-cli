name: Validate CLI-005 terminal output

on:
  push:
    branches:
      - feat/cli-005-terminal-output
    paths:
      - src/output/**
      - tests/terminal-output.test.ts
      - .github/workflows/validate-cli-005.yml

permissions:
  contents: read

jobs:
  validate-terminal-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test terminal output
        run: npm test

      - name: Build
        run: npm run build
