name: Diagnose CLI-008 formatting

on:
  push:
    branches:
      - test/cli-008-static-quality
    paths:
      - tests/static-quality.test.ts
      - .github/workflows/validate-cli-008.yml

permissions:
  contents: read

jobs:
  show-prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Show canonical Prettier diff
        run: |
          node node_modules/prettier/bin/prettier.cjs --write tests/static-quality.test.ts
          git diff --color=never -- tests/static-quality.test.ts
          git diff --exit-code -- tests/static-quality.test.ts
